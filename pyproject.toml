[project]
name = "permit-trade-skills"
version = "0.1.0"
description = "Agentic RAG system for tracking building permits across U.S. jurisdictions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ton Oguara", email = "tomoguara@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "typer",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "sentence-transformers>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.4.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
permit-trade-skills = "permit_trade_skills:main"
pts = "permit_trade_skills:main"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "script"]
markers = [
    "slow: large-fixture performance tests (200k rows; ~1 minute)",
]
