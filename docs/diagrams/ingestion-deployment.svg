;" fill="none" id="postgres-to-user-3"/><polygon points="915.18,272.547,924.489,275.762,920.162,272.119,923.805,267.791,915.18,272.547" fill="#A80036" style="stroke:#A80036;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1359.639" y="185.954" fill="#000" font-size="13" textLength="91.159">status_history</text><text x="1350.8" y="201.087" fill="#000" font-size="13" textLength="108.837">(status changes)</text></g><g class="legend" data-source-line="38"><rect x="1150.706" y="335.187" width="582.206" height="419.422" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="1156.706" y="354.182" fill="#000" font-size="14" textLength="143.021" font-weight="700">External Systems:</text><text x="1156.706" y="370.479" fill="#000" font-size="14">-</text><text x="1166.208" y="370.479" fill="#000" font-size="14" textLength="146.583" font-weight="700">Socrata SODA API:</text><text x="1317.241" y="370.479" fill="#000" font-size="14" textLength="409.671">Live data source for Seattle permits (cos-data.seattle.gov)</text><text x="1165.606" y="386.776" fill="#000" font-size="14" textLength="314.932">- Currently down - using local export fallback</text><text x="1165.606" y="403.073" fill="#000" font-size="14" textLength="242.006">- Rate-limited with per-host limiter</text><text x="1156.706" y="419.369" fill="#000" font-size="14">-</text><text x="1166.208" y="419.369" fill="#000" font-size="14" textLength="90.467" font-weight="700">Local JSON:</text><text x="1261.125" y="419.369" fill="#000" font-size="14" textLength="298.826">Downloaded export for offline/sync testing</text><text x="1165.606" y="435.666" fill="#000" font-size="14" textLength="182.622">- 193,249 rows for Seattle</text><text x="1165.606" y="451.963" fill="#000" font-size="14" textLength="196.198">- Mode: full sync (no cursor)</text><text x="1156.706" y="468.26" fill="#000" font-size="14">-</text><text x="1166.208" y="468.26" fill="#000" font-size="14" textLength="150.37" font-weight="700">Hugging Face Hub:</text><text x="1321.028" y="468.26" fill="#000" font-size="14" textLength="211.053">Source for embedding models</text><text x="1165.606" y="484.557" fill="#000" font-size="14" textLength="301.089">- Model: all-MiniLM-L6-v2 (384 dimensions)</text><text x="1165.606" y="500.854" fill="#000" font-size="14" textLength="186.888">- Downloaded on first sync</text><text x="1165.606" y="517.151" fill="#000" font-size="14" textLength="345.98">- HF_TOKEN env var for authenticated downloads</text><text x="1156.706" y="533.448" fill="#000" font-size="14">-</text><text x="1166.208" y="533.448" fill="#000" font-size="14" textLength="189.485" font-weight="700">PostgreSQL + pgvector:</text><text x="1360.143" y="533.448" fill="#000" font-size="14" textLength="144.874">Canonical data store</text><text x="1165.606" y="549.744" fill="#000" font-size="14" textLength="341.024">- Tables: permits, sync_metadata, status_history</text><text x="1165.606" y="566.041" fill="#000" font-size="14" textLength="324.536">- Vector index: none (exact scan for accuracy)</text><text x="1156.706" y="582.338" fill="#000" font-size="14"> </text><text x="1156.706" y="598.635" fill="#000" font-size="14" textLength="84.595" font-weight="700">Data Flow:</text><text x="1156.706" y="614.932" fill="#000" font-size="14" textLength="389.033">1. Data Engineer provides data source (API or local file)</text><text x="1156.706" y="631.229" fill="#000" font-size="14" textLength="419.125">2. System downloads embedding model from Hugging Face</text><text x="1156.706" y="647.526" fill="#000" font-size="14" textLength="362.763">3. System reads permits and upserts to PostgreSQL</text><text x="1156.706" y="663.823" fill="#000" font-size="14" textLength="388.691">4. Sync reports and status history stored in PostgreSQL</text><text x="1156.706" y="680.119" fill="#000" font-size="14"> </text><text x="1156.706" y="696.416" fill="#000" font-size="14" textLength="113.764" font-weight="700">Configuration:</text><text x="1156.706" y="712.713" fill="#000" font-size="14" textLength="414.463">- Database URL: PERMIT_TRADE_SKILLS_DB_URL or --db-url</text><text x="1156.706" y="729.01" fill="#000" font-size="14" textLength="372.162">- User-Agent: configured in ingest.user_agent setting</text><text x="1156.706" y="745.307" fill="#000" font-size="14" textLength="368.614">- Rate limiting: settings ingest.rate_limit_per_minute</text></g><?plantuml-src VLPHRzis47xNhpZqOOkno4MJO5YD8a0QEqXMfyaYTo_B8D3IMUPAanf9sGc6_lVUaPAi65dVR1w_ku_VVNUsbruXtEWAdPT6mq-GFUi2CYygX1HcJnwj5efEdSUDIznNgS4QX-5JBQpOW5kBqkoahi3R1fEa5iLNXh_fqLFX1MIciGMwD_1V0l1NPWeRJk-c5t1nV_EeZp8KdjdSrQW3PFGt20VEb28NjMJKt1IKxlVixZDSIOK4mgVQM1zlAexc_pYZas-lqSZGRkMUmdLJLSpwIXG8rytoKMUeFMhwjh12kvMn6xGkf5wlydMpV3qjKrqAXstQU-DyPJ7xOmw_G5rjiV36FkeQxKRwt5jHOaxYAULW-Z4ahoF2lKZ_nQ5jCmRvPfh88jg0Q2Z8jtz-8Mt2nv2cvxrcC06B_pRKNAeI24190D9jjoQHINSGMo6LM2eSxU5x8Ib1RSrMbkWWIWshA7oQXbifVnqbVK66XpnSsJTMzuMjsRbaa7bmioynuCYFcssMM9RK8vV41Wn1v3cjZ2WTR4o9YYW9fT9RgUNyDft_ccvFZk7qjxEqb9l1qzey4uXGx2h499sYtCwaQykmgADUzZmTrNGyBarDKJ_w4OBlvHlqejNVDZH7o8Aw7-9wWboC92gih7bIypxmVt3X6vUl9UTvPgBX08gru64V9Od22dK9LbPhJoxxi3m_dFR9XxVBSmgb73mSs124kTnYQ1TPZZq8D3JG3NAh4XmLngLyQUnYP5oPxOWIS-hBnbeQE_KS6ae7ZUDs1AFqbgFEBcamMiY3y9WgIRcnX9tqQwwKhaa5YAUs8xtV5v7kjFKCuRhKnDUiLefcwstefUTDgAksrBltfySdP--3UOTlQyEtP9e9h1gbGeFXI1ie6kkC7NKK3hTC99BjrJgme1kaLXCuz3GSaQU1F8tQaGrS9-FWPJHRAsb93ARKXg-lyiNTfzbdGBs5hR2XicWyRG4l2y52zlFKCNzraKNwbq8RBLdRs7lsQbjfmRl4JRhc7xzq_l61CLlGdo4tI5tYqmGeDm9jTb7G6mgX8zc2X1N5Cpatc3KilYjbTfrBtutXnQBSRvMXFuzuvr6wwA-ul01Engtd1rlbe2-micO3msuIxhJ7MMHCvtX1WnMNWWDlOAyaOSx6yJUsdVvmjntELfIePqbo397nsPT6hsH5Il0Is0zejxJWoyDy0lUpXzkRHRvuk9ZEykpJpNoUvTEFESNuwMbQBjF6gW3advdqWZQ1dq3HvewbPVXJCEPzaWk-00vzEnfn1kEqqSca2xaEHVmm3-6SDCatKZSU4zetSUiatm40?></g></svg>